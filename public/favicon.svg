<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jbz" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Solid gradient tile rather than the thin-stroke wordmark: at 16px a
       hairline J disappears, while a filled shape stays readable. -->
  <rect width="64" height="64" rx="15" fill="url(#jbz)"/>

  <!-- J — jobs and journey -->
  <path d="M23 17h9v20c0 7.7-5 12.5-12.6 12.5"
        fill="none" stroke="#fff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Growth arrow -->
  <path d="M38 30l10-10m0 0h-7.5m7.5 0v7.5"
        fill="none" stroke="#fff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
</svg>
