<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="btg51Ek6aGXFHdJM89FW1RscMfWbUflxzkyvJOqRRQk" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Google's favicon crawler wants a raster icon in a multiple of 48px;
         the SVG alone is why search results showed the generic globe. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/favicon-96.png" />

    <title>JोBz — Track • Apply • Grow</title>
    <meta
      name="description"
      content="AI-powered career management. Track applications, tailor your resume to each job, prepare for interviews and see what is working."
    />

    <!-- Browser chrome matches the app surface in each theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0f" />

    <meta property="og:title" content="JोBz — Track • Apply • Grow" />
    <meta
      property="og:description"
      content="AI-powered career management for students, graduates and job seekers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JoBz" />
    <meta property="og:url" content="https://jobzs.vercel.app/" />
    <link rel="canonical" href="https://jobzs.vercel.app/" />

    <!-- Tells Google the site's name, so results say "JoBz" instead of
         falling back to the hosting provider's name. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JoBz",
        "alternateName": ["JोBz", "jobzs"],
        "url": "https://jobzs.vercel.app/"
      }
    </script>

    <!-- Paints the correct background before React mounts, so a reload in dark
         mode does not flash white. Runs before first paint, hence inline. -->
    <script>
      try {
        var stored = localStorage.getItem('theme')
        if (stored === 'dark') document.documentElement.classList.add('dark')
      } catch (e) { /* private mode, storage unavailable */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
